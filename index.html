<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvest Helper - Notion Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: white;
            padding: 20px;
        }
        
        .harvest-container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .harvest-iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="harvest-container">
        <iframe id="harvestWidget" class="harvest-iframe" src="about:blank"></iframe>
    </div>

    <script>
        // Get URL parameters to build Harvest widget URL
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }
        
        // Build Harvest widget URL
        var appName = getUrlParameter('app_name') || 'Notion';
        var permalink = getUrlParameter('permalink') || window.location.href;
        var itemName = getUrlParameter('item_name') || 'Notion Page';
        var itemId = getUrlParameter('item_id') || '';
        
        var harvestUrl = 'https://platform.harvestapp.com/platform/timer?' +
            'app_name=' + encodeURIComponent(appName) +
            '&closable=false' +
            '&permalink=' + encodeURIComponent(permalink) +
            '&external_item_name=' + encodeURIComponent(itemName) +
            '&external_item_id=' + encodeURIComponent(itemId);
        
        document.getElementById('harvestWidget').src = harvestUrl;
    </script>
</body>
</html>
